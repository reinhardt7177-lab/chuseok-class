# 수업 시작 전에 Render 서비스를 깨워 둔다.
#
# 무료 등급은 15분 동안 아무도 안 들어오면 잠들고, 다시 깨는 데 1분쯤 걸린다.
# 수업이 시작되면 학생 기기가 6초마다 서버를 부르므로 그 뒤로는 안 잔다.
# 그러니 깨워 둘 필요가 있는 것은 수업 직전 몇 분뿐이다.
#
# ─────────────────────────────────────────────────────────────
# ⚠ 24시간 깨워 두지 말 것
#
# Render 무료 인스턴스 시간 750시간은 서비스별이 아니라 워크스페이스 전체 몫이고,
# 다 쓰면 그 달이 끝날 때까지 무료 서비스가 전부 정지된다.
#   하루 종일 × 30일        = 720시간  → 할당량을 거의 다 먹는다
#   지금 설정(평일 5.5시간) = 121시간  → 750시간의 16%
# ─────────────────────────────────────────────────────────────
#
# 손으로 누르기
#   GitHub 저장소 → Actions → "수업 전 깨우기" → Run workflow
#   (휴대폰 브라우저에서도 눌린다. 수업 2~3분 전이면 넉넉하다.)

name: 수업 전 깨우기

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 몇 분 동안 깨워 둘까요 (수업 직전이면 3분이면 됩니다)
        required: false
        default: '3'

  # 평일 수업 시간대에 저절로 깨워 둔다 — 한국 시간 08:40 ~ 14:00.
  #
  # 한 번 부르면 15분을 버티므로 10분 간격이면 그 사이 내내 깨어 있다.
  # 몇 교시에 하든 들어가는 시간대이고, 한 달에 약 120시간을 쓴다(750시간 중 16%).
  #
  # cron은 UTC 기준이라 한국 시간에서 9를 뺀다.
  # 한국 08:40은 전날 23:40 UTC이므로, 앞부분은 요일이 하루씩 당겨진다(일~목 = 월~금).
  #
  # 좁히려면 — 1교시만 쓰려면 아래 셋 중 첫 줄만 남기면 된다(월 20시간).
  # 넓히려면 — '*/10 0-4' 의 4를 키운다. 5로 바꾸면 한국 15시까지다.
  #
  # 주의 — GitHub는 저장소에 60일 동안 아무 활동이 없으면 예약 실행을 꺼 버린다.
  #        예약 시각도 몇 분씩 밀리는 일이 잦다. 꼭 맞아야 하면 손으로 누르는 편이 낫다.
  schedule:
    - cron: '40,50 23 * * 0-4'   # 한국 08:40~08:50 (월~금)
    - cron: '*/10 0-4 * * 1-5'   # 한국 09:00~13:50 (월~금)
    - cron: '0 5 * * 1-5'        # 한국 14:00 — 마지막 한 번

# 동시에 여러 번 돌 필요가 없다
concurrency:
  group: wake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 깨우기
        env:
          URL: https://chuseok-class.onrender.com/api/connect
          # 예약 실행은 한 번만 부르면 된다(15분을 버틴다).
          # 손으로 누를 때만 수업 직전이라 몇 분 지켜본다.
          MINUTES: ${{ github.event_name == 'schedule' && '0' || inputs.minutes || '3' }}
        run: |
          # /api/connect 는 열쇠 없이 부르면 {"server":true} 만 돌려준다.
          # 방을 만들지도, 상태를 건드리지도 않는다.
          # GitHub Actions는 bash -e 로 돌린다. 반복문 끝에서 조건이 거짓이면
          # 그대로 스크립트가 끝나 버리므로, 판단은 모두 if 로 쓴다.
          end=$(( SECONDS + MINUTES * 60 ))
          first=1
          ok=0
          while :; do
            t0=$(date +%s%3N)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL" || echo 000)
            took=$(( $(date +%s%3N) - t0 ))

            if [ "$first" = 1 ]; then
              first=0
              if [ "$took" -gt 3000 ]; then
                echo "잠들어 있었습니다 — 깨우는 데 ${took}ms ($code)"
              else
                echo "이미 깨어 있었습니다 — ${took}ms ($code)"
              fi
            else
              echo "  확인 ${took}ms ($code)"
            fi

            if [ "$code" = "200" ]; then
              ok=1
            else
              echo "::warning::응답이 200이 아닙니다 ($code)"
            fi

            if [ "$SECONDS" -ge "$end" ]; then
              break
            fi
            sleep 60
          done

          if [ "$ok" = 1 ]; then
            echo "수업을 시작하셔도 됩니다."
          else
            echo "::error::한 번도 200을 받지 못했습니다. 주소를 확인해 주세요."
            exit 1
          fi
